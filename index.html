<!doctype html>
<html lang="en">
  <head>
    <title>SpendWise</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1 class="heart">My Budget Tracker</h1>

    <p>Track all your expenses and manage your budget effectively.</p>

    <div class="category-container">
      <h2>Expense Categories</h2>
      <label id="name" for="name">Expense Name:</label>
      <input id="name-input" type="text" id="name" name="name" /><br /><br />
      <label id="amount" for="amount">Expense Amount:</label>
      <input
        id="amount-input"
        type="number"
        id="amount"
        name="amount"
      /><br /><br />
      <label id="category" for="category">Category:</label>
      <select name="category" id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Utilities">Utilities</option>
      </select>
    </div>
    <section>
      <h2>Your Expenses</h2>
      <textarea name="expenses" id="expenses" disabled>No content</textarea>
    </section>
  </body>
</html>
